<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERD SIGAE v3 - Ecuador Model</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }

        h2 {
            text-align: center;
            color: #e0e0e0;
            padding: 20px 0 10px;
            margin: 0;
            font-size: 1.4rem;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            flex-wrap: wrap;
        }

        .filter-bar button {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-bar button:hover {
            background: #533483;
        }

        .filter-bar button.active {
            background: #533483;
            border-color: #a78bfa;
            box-shadow: 0 0 6px rgba(167, 139, 250, 0.4);
        }

        .filter-divider {
            width: 1px;
            height: 24px;
            background: #0f3460;
            margin: 0 4px;
        }

        /* ===== LEGEND ===== */
        .legend-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            user-select: none;
            border: 1px solid transparent;
        }

        .legend-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .legend-item.disabled {
            opacity: 0.3;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
            transition: all 0.2s;
        }

        .legend-item.disabled .legend-dot {
            filter: grayscale(100%);
        }

        .legend-check {
            font-size: 10px;
            color: #4ade80;
            margin-left: 2px;
            display: none;
        }

        .legend-item:not(.disabled) .legend-check {
            display: inline;
        }

        /* ===== ZOOM CONTROLS ===== */
        .controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            flex-wrap: wrap;
        }

        .controls-bar button {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .controls-bar button:hover {
            background: #533483;
        }

        .controls-bar .zoom-level {
            color: #a0a0c0;
            font-size: 13px;
            min-width: 50px;
            text-align: center;
        }

        /* ===== VIEWPORT ===== */
        #erd-viewport {
            width: 100%;
            height: calc(100vh - 210px);
            overflow: hidden;
            cursor: grab;
            position: relative;
            background-color: #1a1a2e;
        }

        #erd-viewport.grabbing {
            cursor: grabbing;
        }

        #erd-wrap {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
            padding: 20px;
            min-width: 100%;
        }

        #erd svg {
            width: 100%;
        }

        /* ===== TABLE TRANSITIONS ===== */
        #erd svg.erDiagram .node {
            transition: opacity 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        #erd svg.erDiagram .relationship,
        #erd svg.erDiagram .relationshipLabel {
            transition: opacity 0.3s ease;
        }

        /* ===== FOCUS MODE ===== */
        #erd svg.erDiagram .node.focused {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6)) brightness(1.2);
        }

        #erd svg.erDiagram .node.connected {
            filter: drop-shadow(0 0 6px rgba(167, 139, 250, 0.4));
        }

        #erd svg.erDiagram .relationship.highlighted {
            stroke: #a78bfa !important;
            stroke-width: 2.5 !important;
            filter: drop-shadow(0 0 4px rgba(167, 139, 250, 0.5));
        }

        #erd svg.erDiagram .relationshipLabel.highlighted {
            fill: #a78bfa !important;
            font-weight: 700;
        }

        /* ===== FOCUS INFO BAR ===== */
        #focus-info {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #a78bfa;
            border-radius: 12px;
            padding: 10px 20px;
            color: #e0e0e0;
            font-size: 13px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            text-align: center;
        }

        #focus-info.visible {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #focus-info .focus-table-name {
            font-weight: 700;
            color: #a78bfa;
            font-size: 14px;
        }

        #focus-info .focus-connections {
            color: #a0a0c0;
        }

        #focus-info .focus-close-btn {
            background: #533483;
            border: none;
            color: #e0e0e0;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        #focus-info .focus-close-btn:hover {
            background: #a78bfa;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>

        function getLighterColor(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            r = Math.min(255, r + 40);
            g = Math.min(255, g + 40);
            b = Math.min(255, b + 40);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            r = Math.max(0, r - 30);
            g = Math.max(0, g - 30);
            b = Math.max(0, b - 30);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;

        // ===== RENDER DIAGRAM =====

        const entityDefRegex = /^\s*([A-Z_]+)\s*\{/gm;
        const entityNamesFromDef = [...diagram.matchAll(entityDefRegex)].map(m => m[1]);
        entityNamesFromDef.sort((a, b) => b.length - a.length);

        // Build entity -> color map
        const entityColorMap = {};
        for (const [entity, color] of Object.entries(DOMAIN_COLORS)) {
            entityColorMap[entity] = color;
        }

        // ===== APPLY DOMAIN COLORS =====
        function applyColors() {
            const allNodes = document.querySelectorAll('#erd svg.erDiagram .node');
            allNodes.forEach(node => {
                const textContent = node.textContent || '';
                let entityName = null;
                for (const name of entityNamesFromDef) {
                    if (textContent.includes(name)) {
                        entityName = name;
                        break;
                    }
                }

                const domainColor = entityName ? entityColorMap[entityName] : null;
                if (!domainColor) return;

                const firstPath = node.querySelector('path[d]');
                if (firstPath) {
                    const d = firstPath.getAttribute('d');
                    const nums = d.match(/-?[\d.]+/g)?.map(Number);
                    if (nums && nums.length >= 8) {
                        const xs = [nums[0], nums[2], nums[4], nums[6]];
                        const ys = [nums[1], nums[3], nums[5], nums[7]];
                        const x = Math.min(...xs), y = Math.min(...ys);
                        const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', x);
                        rect.setAttribute('y', y);
                        rect.setAttribute('width', w);
                        rect.setAttribute('height', h);
                        rect.setAttribute('rx', '8');
                        rect.setAttribute('fill', getDarkerColor(domainColor));
                        rect.setAttribute('stroke', domainColor);
                        rect.setAttribute('stroke-width', '2');
                        firstPath.replaceWith(rect);
                    }
                }

                const textEls = node.querySelectorAll('text tspan');
                if (textEls.length > 0) {
                    textEls[0].setAttribute('fill', '#fff');
                    textEls[0].setAttribute('font-weight', '700');
                }

                node.querySelectorAll('.row-rect-odd path, .row-rect-even path').forEach(p => {
                    p.setAttribute('stroke', 'none');
                    p.setAttribute('fill', getLighterColor(domainColor));
                });
            });

            document.querySelectorAll('#erd svg.erDiagram .relationship, #erd svg.erDiagram .relationshipLabel').forEach(el => {
                el.setAttribute('stroke', '#555');
                el.setAttribute('fill', '#aaa');
            });
        }

        applyColors();

        // ===== FILTERING SYSTEM =====
        // Track which entity groups are visible
        let activeGroups = new Set([
            'catalogos', 'configuracion', 'estructura', 'personas', 'matriculas',
            'evaluaciones-maestra', 'evaluaciones-transaccional', 'asistencia-conducta',
            'auditoria', 'sincronizacion', 'analitica'
        ]);

        let isolateMode = false;

        // Map entity name to its DOM node
        const entityNodeMap = {};

        function buildEntityNodeMap() {
            const allNodes = document.querySelectorAll('#erd svg.erDiagram .node');
            allNodes.forEach(node => {
                const textContent = node.textContent || '';
                for (const name of entityNamesFromDef) {
                    if (textContent.includes(name)) {
                        entityNodeMap[name] = node;
                        break;
                    }
                }
            });

        buildEntityNodeMap();

        function applyFilter() {
            // Determine which entities should be visible
            const visibleEntities = new Set();
            for (const [entity, groups] of Object.entries(ENTITY_GROUPS)) {
                for (const group of groups) {
                    if (activeGroups.has(group)) {
                        visibleEntities.add(entity);
                        break;
                    }
                }
            }

            // Show/hide entity nodes
            for (const [entity, node] of Object.entries(entityNodeMap)) {
                if (visibleEntities.has(entity)) {

                } else {

                    node.style.pointerEvents = 'none';

            allRelationships.forEach(rel => {

        function buildRelationshipMap() {
            const relMap = {}; // entity -> Set of connected entities
            // Mermaid relationship connector pattern: ||--o{, ||--||, }o--||, etc.
            const connectorPattern = /\s*\|?\|?--o?\|?\{?\s*/;

            const relLines = diagram.split('\n').filter(line => {
                const trimmed = line.trim();

                    // Entity B is everything after the connector, before the colon (label)

                    const entityB = afterConnector.split(/\s*:/)[0].trim().split(/\s/)[0];

                        if (!relMap[entityA]) relMap[entityA] = new Set();
                        if (!relMap[entityB]) relMap[entityB] = new Set();
                        relMap[entityA].add(entityB);
                        relMap[entityB].add(entityA);
                    }
                }
            }
            return relMap;

            focusInfo.classList.add('visible');
        }

        function exitFocusMode() {
            focusMode = false;
            focusedEntity = null;

            // Remove focus classes
            document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
                node.classList.remove('focused', 'connected');
            });
            document.querySelectorAll('#erd svg.erDiagram .relationship, #erd svg.erDiagram .relationshipLabel').forEach(rel => {
                rel.classList.remove('highlighted');
            });

            // Hide focus info bar
            document.getElementById('focus-info').classList.remove('visible');

            // Re-apply the current filter
            applyFilter();
        }

        // Add click handlers to table nodes
        function addTableClickHandlers() {
            for (const [entity, node] of Object.entries(entityNodeMap)) {
                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (focusMode && focusedEntity === entity) {
                        exitFocusMode();
                    } else {
                        enterFocusMode(entity);
                    }
                });
            }
        }

        addTableClickHandlers();

        // Exit focus mode on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && focusMode) {
                exitFocusMode();
            }
        });

        // Exit focus mode when clicking on background (viewport)
        document.getElementById('erd-viewport').addEventListener('click', (e) => {
            if (focusMode && !e.target.closest('.node')) {
                exitFocusMode();
            }
        });

        // Close button handler
        document.getElementById('focus-close-btn').addEventListener('click', () => {
            exitFocusMode();
        });

        // ===================== PAN & ZOOM =====================
        const viewport = document.getElementById('erd-viewport');
        const wrap = document.getElementById('erd-wrap');
        const zoomLevelEl = document.getElementById('zoom-level');

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function updateTransform() {
            wrap.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
        }

        function setZoom(newScale, cx, cy) {
            const prevScale = scale;
            scale = Math.min(3, Math.max(0.1, newScale));
            if (cx !== undefined && cy !== undefined) {
                panX = cx - (cx - panX) * (scale / prevScale);
                panY = cy - (cy - panY) * (scale / prevScale);
            }
            updateTransform();
        }

        // Mouse drag
        viewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            viewport.classList.add('grabbing');
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.classList.remove('grabbing');
        });

        // Scroll zoom
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = viewport.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            setZoom(scale * delta, cx, cy);
        }, { passive: false });

        // Touch support
        let lastTouchDist = 0;
        let lastTouchCenter = null;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                lastTouchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
            e.preventDefault();
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const rect = viewport.getBoundingClientRect();
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                if (lastTouchDist > 0) {
                    const delta = dist / lastTouchDist;
                    setZoom(scale * delta, cx, cy);
                }
                lastTouchDist = dist;
            }
            e.preventDefault();
        }, { passive: false });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
            lastTouchDist = 0;
        });

        // Buttons
        document.getElementById('zoom-in').addEventListener('click', () => {
            const rect = viewport.getBoundingClientRect();
            setZoom(scale * 1.25, rect.width / 2, rect.height / 2);
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            const rect = viewport.getBoundingClientRect();
            setZoom(scale / 1.25, rect.width / 2, rect.height / 2);
        });

        document.getElementById('zoom-reset').addEventListener('click', () => {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        });

        document.getElementById('fit-view').addEventListener('click', () => {
            const svgEl = document.querySelector('#erd svg');
            if (!svgEl) return;
            const svgW = svgEl.scrollWidth || svgEl.clientWidth;
            const svgH = svgEl.scrollHeight || svgEl.clientHeight;
            const vpW = viewport.clientWidth;
            const vpH = viewport.clientHeight;
            scale = Math.min(vpW / svgW, vpH / svgH, 1) * 0.95;
            panX = 0;
            panY = 0;
            updateTransform();
        });

        updateTransform();
    </script>
</body>

</html>
