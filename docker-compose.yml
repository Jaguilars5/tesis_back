name: edu-manager

services:
  # ─────────────────────────────────────────
  # BASE DE DATOS
  # ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: edu-manager-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Persiste los datos aunque bajes los contenedores
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edu-manager-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5037:80"
    depends_on:
      db:
        condition: service_healthy
  # ─────────────────────────────────────────
  # REDIS (broker para Celery)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: edu-manager-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # APLICACIÓN DJANGO
  # ─────────────────────────────────────────
  web:
    build: .
    container_name: edu-manager-web
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --ws websockets
    volumes:
      # Monta el código local dentro del contenedor
      # Así los cambios en tu código se reflejan sin reconstruir
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Apunta exactamente a tu estructura de settings
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - WAIT_FOR_DB=true
      - RUN_MIGRATIONS=true
      # Ejecuta los seeds idempotentes al arrancar. Ponlo en "false" si no quieres
      # repoblar datos de prueba en cada 'up'.
      - RUN_SEED=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # CELERY WORKER
  # ─────────────────────────────────────────
  celery:
    build: .
    container_name: edu-manager-celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - WAIT_FOR_DB=false
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # FLOWER - Monitor visual de Celery (opcional)
  # Accesible en http://localhost:5555
  # ─────────────────────────────────────────
  flower:
    build: .
    container_name: edu-manager-flower
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - WAIT_FOR_DB=false
      - RUN_MIGRATIONS=false
    depends_on:
      - redis
      - celery

  ngrok:
    image: ngrok/ngrok:latest
    container_name: edu-manager-ngrok
    command: http http://host.docker.internal:5173 --log=stdout
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - web

# ─────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ─────────────────────────────────────────
volumes:
  postgres_data:
    name: edu-manager_postgres_data
