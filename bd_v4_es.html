            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

            width: 100%;
            height: calc(100vh - 130px);
            overflow: hidden;
            cursor: grab;
            position: relative;
            background-color: #1a1a2e;
        }

        #erd-viewport.grabbing {
            cursor: grabbing;
        }

        #erd-wrap {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
            padding: 20px;
            min-width: 100%;
        }

        #erd svg {

        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;

        function getLighterColor(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            r = Math.min(255, r + 40);
            g = Math.min(255, g + 40);
            b = Math.min(255, b + 40);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function getDarkerColor(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            r = Math.max(0, r - 30);
            g = Math.max(0, g - 30);
            b = Math.max(0, b - 30);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;

        const { svg } = await mermaid.render('erd-main', diagram);
        document.getElementById('erd').innerHTML = svg;

        // Analizar nombres de entidades del diagrama (orden garantizado + nombres exactos)
        const entityDefRegex = /^\s*([A-Z_]+)\s*\{/gm;
        const entityNamesFromDef = [...diagram.matchAll(entityDefRegex)].map(m => m[1]);
        // Ordenar por longitud descendente para que nombres más largos coincidan primero
        entityNamesFromDef.sort((a, b) => b.length - a.length);

        // Construir mapa entidad -> color
        const entityColorMap = {};
        for (const [entity, color] of Object.entries(DOMAIN_COLORS)) {
            entityColorMap[entity] = color;
        }

        // Aplicar colores de dominio a nodos de tabla
        const allNodes = document.querySelectorAll('#erd svg.erDiagram .node');
        allNodes.forEach(node => {
            // Intentar encontrar nombre de entidad coincidiendo con nombres conocidos en contenido de texto
            const textContent = node.textContent || '';
            let entityName = null;
            for (const name of entityNamesFromDef) {
                if (textContent.includes(name)) {
                    entityName = name;
                    break;
                }
            }

            const domainColor = entityName ? entityColorMap[entityName] : null;
            if (!domainColor) return; // Saltar nodos que no sean entidades

            const firstPath = node.querySelector('path[d]');
            if (firstPath) {
                const d = firstPath.getAttribute('d');
                const nums = d.match(/-?[\d.]+/g)?.map(Number);
                if (nums && nums.length >= 8) {
                    const xs = [nums[0], nums[2], nums[4], nums[6]];
                    const ys = [nums[1], nums[3], nums[5], nums[7]];
                    const x = Math.min(...xs), y = Math.min(...ys);
                    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', x);
                    rect.setAttribute('y', y);
                    rect.setAttribute('width', w);
                    rect.setAttribute('height', h);
                    rect.setAttribute('rx', '8');
                    rect.setAttribute('fill', getDarkerColor(domainColor));
                    rect.setAttribute('stroke', domainColor);
                    rect.setAttribute('stroke-width', '2');
                    firstPath.replaceWith(rect);
                }
            }

            // Colorear texto del encabezado
            const textEls = node.querySelectorAll('text tspan');
            if (textEls.length > 0) {
                textEls[0].setAttribute('fill', '#fff');
                textEls[0].setAttribute('font-weight', '700');
            }

            // Colorear rectángulos de fila
            node.querySelectorAll('.row-rect-odd path, .row-rect-even path').forEach(p => {
                p.setAttribute('stroke', 'none');
                p.setAttribute('fill', getLighterColor(domainColor));
            });
        });

        // Colorear líneas de relación por dominio
        document.querySelectorAll('#erd svg.erDiagram .relationship, #erd svg.erDiagram .relationshipLabel').forEach(el => {
            el.setAttribute('stroke', '#555');
            el.setAttribute('fill', '#aaa');
        });

        // ===================== PAN & ZOOM =====================
        const viewport = document.getElementById('erd-viewport');
        const wrap = document.getElementById('erd-wrap');
        const zoomLevelEl = document.getElementById('zoom-level');

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function updateTransform() {
            wrap.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
        }

        function setZoom(newScale, cx, cy) {
            const prevScale = scale;
            scale = Math.min(3, Math.max(0.1, newScale));
            if (cx !== undefined && cy !== undefined) {
                panX = cx - (cx - panX) * (scale / prevScale);
                panY = cy - (cy - panY) * (scale / prevScale);
            }
            updateTransform();
        }

        // Arrastre con ratón
        viewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            viewport.classList.add('grabbing');
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.classList.remove('grabbing');
        });

        // Zoom con rueda de desplazamiento
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = viewport.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            setZoom(scale * delta, cx, cy);
        }, { passive: false });

        // Soporte táctil
        let lastTouchDist = 0;
        let lastTouchCenter = null;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                lastTouchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
            e.preventDefault();
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const rect = viewport.getBoundingClientRect();
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                if (lastTouchDist > 0) {
                    const delta = dist / lastTouchDist;
                    setZoom(scale * delta, cx, cy);
                }
                lastTouchDist = dist;
            }
            e.preventDefault();
        }, { passive: false });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
            lastTouchDist = 0;
        });

        // Botones
        document.getElementById('zoom-in').addEventListener('click', () => {
            const rect = viewport.getBoundingClientRect();
            setZoom(scale * 1.25, rect.width / 2, rect.height / 2);
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            const rect = viewport.getBoundingClientRect();
            setZoom(scale / 1.25, rect.width / 2, rect.height / 2);
        });

        document.getElementById('zoom-reset').addEventListener('click', () => {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        });

        document.getElementById('fit-view').addEventListener('click', () => {
            const svgEl = document.querySelector('#erd svg');
            if (!svgEl) return;
            const svgW = svgEl.scrollWidth || svgEl.clientWidth;
            const svgH = svgEl.scrollHeight || svgEl.clientHeight;
            const vpW = viewport.clientWidth;
            const vpH = viewport.clientHeight;
            scale = Math.min(vpW / svgW, vpH / svgH, 1) * 0.95;
            panX = 0;
            panY = 0;
            updateTransform();
        });

        updateTransform();
    </script>
</body>

</html>
